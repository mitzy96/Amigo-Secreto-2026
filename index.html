<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Amigo secreto 2026</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#245d43,#09291f);color:#fff;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,440px);text-align:center;border:1px solid #d6b97766;border-radius:28px;padding:32px 24px;background:#123b2e;box-shadow:0 20px 60px #0005;position:relative}small{letter-spacing:3px;color:#e9cb87}h1{font-family:Georgia,serif;font-size:40px;margin:12px 0}.gift{font-size:88px;animation:bob 3s ease-in-out infinite}article{background:#fff8e9;color:#263d32;padding:24px 12px;border-radius:18px;margin:20px 0}h2{color:#a52d3c;font-size:36px;overflow-wrap:anywhere;margin:12px 0}footer{color:#e9cb87;font-size:14px;line-height:1.6}.snow{position:fixed;top:-20px;pointer-events:none;animation:fall linear infinite;color:white;opacity:.65}@keyframes fall{to{transform:translateY(110vh)}}@keyframes bob{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><small>✦ NAVIDAD 2026 ✦</small><h1>Amigo secreto</h1><div class="gift">🎁</div><p id="hello">Intercambio de regalos</p><article><p id="intro">Abre el enlace individual que te envió el organizador.</p><h2 id="recipient"></h2><p id="secret" hidden>¡Guarda el secreto! 🤫</p></article><footer>Presupuesto: <b>S/ 20</b><br>26 de noviembre de 2026<br><br>Compartamos con alegría y compañerismo.</footer></main><script>try{const raw=location.hash.slice(1);if(raw){const p=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));if(!Array.isArray(p)||p.length!==2||!p.every(x=>typeof x==='string'&&x.length>0&&x.length<80)||p[0]===p[1])throw Error();document.querySelector('#hello').textContent='¡Hola, '+p[0]+'!';document.querySelector('#intro').textContent='La persona a quien le regalarás es…';document.querySelector('#recipient').textContent=p[1];document.querySelector('#secret').hidden=false}}catch{document.querySelector('#intro').textContent='Enlace inválido. Solicita tu enlace al organizador.'}for(let i=0;i<25;i++){const s=document.createElement('span');s.className='snow';s.textContent='❄';s.style.left=Math.random()*100+'vw';s.style.animationDuration=5+Math.random()*9+'s';s.style.animationDelay=-Math.random()*12+'s';s.style.fontSize=8+Math.random()*14+'px';document.body.append(s)}</script></html>
